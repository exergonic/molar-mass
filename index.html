<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Molar Mass Calculator</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>Molar Mass Calculator</h1>
    <p>Enter the molecular formula below.</p>
    <div id="input-text">
      <input
        type="text"
        id="mol-formula"
        name="mol-formula"
        aria-label="Molecular formula"
        placeholder="Enter Molecular Formula..."
        autofocus
      />
    </div>
    <div id="formula-display-row" hidden>
      <div id="formula-display" aria-live="polite"></div>
      <button id="formula-copy" type="button" title="Copy formula with subscripts for documents">Copy</button>
    </div>
    <div>
      <h1>
        <span id="output-text"></span>
      </h1>
    </div>
    <div id="decimal-control">
      <span id="decimal-label">Decimals:</span>
      <button id="decimal-minus" type="button" aria-label="Fewer decimal places">−</button>
      <span id="decimal-value" aria-live="polite">2</span>
      <button id="decimal-plus" type="button" aria-label="More decimal places">+</button>
    </div>
    <div id="details-text" class="details-text"></div>
  </body>
</html>
