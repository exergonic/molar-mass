<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Molar Mass Calculator</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="index.css" />
    <script>
      // Apply saved view choices before first paint, so there's no light flash in dark mode.
      try {
        const theme = localStorage.getItem("molwt-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
        if (localStorage.getItem("molwt-large-text") === "1") {
          document.documentElement.classList.add("large-text");
        }
      } catch (e) {}
    </script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>Molar Mass Calculator</h1>
    <p>Enter the molecular formula below.<br />Enter saves. Escape clears.</p>
    <div id="input-text">
      <input
        type="text"
        id="mol-formula"
        name="mol-formula"
        aria-label="Molecular formula"
        placeholder="Enter Molecular Formula..."
        autofocus
      />
      <button id="formula-clear" type="button" aria-label="Clear formula" title="Clear (Esc)" hidden>×</button>
    </div>
    <div id="formula-display-row" hidden>
      <div id="formula-display" aria-live="polite"></div>
      <button id="formula-copy" type="button" title="Copy formula with subscripts for documents">Copy</button>
    </div>
    <p id="formula-problem" role="status" hidden></p>
    <div>
      <h1>
        <span id="output-text"></span><span id="output-unit">g/mol</span>
      </h1>
    </div>
    <div id="decimal-control">
      <span id="decimal-label">Decimals:</span>
      <button id="decimal-minus" type="button" aria-label="Fewer decimal places">−</button>
      <span id="decimal-value" aria-live="polite">2</span>
      <button id="decimal-plus" type="button" aria-label="More decimal places">+</button>
    </div>
    <div id="converter" hidden>
      <label class="converter-field">
        <input id="convert-grams" type="number" inputmode="decimal" min="0" step="any" placeholder="mass" aria-label="Mass in grams" />
        <span>g</span>
      </label>
      <span class="converter-arrow" aria-hidden="true">⇄</span>
      <label class="converter-field">
        <input id="convert-moles" type="number" inputmode="decimal" min="0" step="any" placeholder="amount" aria-label="Amount in moles" />
        <span>mol</span>
      </label>
    </div>
    <div id="details-text" class="details-text"></div>
    <aside id="history" aria-label="Saved molar masses">
      <div id="history-header">
        <h2>History</h2>
        <button id="history-clear" type="button" hidden>Clear all</button>
      </div>
      <p id="history-empty">Press Enter to save a result here. Clearing a formula saves it too.</p>
      <ul id="history-list"></ul>
    </aside>
    <div id="view-controls">
      <button id="theme-toggle" type="button"></button>
      <button id="text-size-toggle" type="button" aria-pressed="false" title="Larger text">A+</button>
    </div>
  </body>
</html>
